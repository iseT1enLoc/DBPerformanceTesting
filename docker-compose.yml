services:
  scylla:
    image: scylladb/scylla:6.2
    container_name: scylla
    ports:
      - "9142:9042"   # CQL native
      - "9260:9160"   # Thrift (legacy)
      - "8000:8000"   # Alternator (DynamoDB-compatible API)
    volumes:
      - scylla-data:/var/lib/scylla
    command: >
      --smp 1
      --memory 512M
      --overprovisioned 1
      --developer-mode 1
      --alternator-port 8000
      --alternator-write-isolation always_use_lwt
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  scylla-data:
